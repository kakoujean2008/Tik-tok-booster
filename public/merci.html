<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commande confirmée — TikTok BOOSTER</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  body {
    background: #0A0A0F;
    color: #F5F5F7;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 360px; }
  .icon { font-size: 54px; margin-bottom: 16px; }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 24px;
    margin-bottom: 10px;
  }
  p { color: #8B8B96; font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
  a {
    display: inline-block;
    background: linear-gradient(90deg, #25F4EE, #FE2C55);
    color: #0A0A0F;
    font-weight: 700;
    padding: 14px 26px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 15px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🚀</div>
    <h1>Commande reçue !</h1>
    <p>Ton paiement est en cours de vérification. Dès qu'il est confirmé, ta commande est lancée automatiquement — en général en quelques minutes.</p>
    <a href="/">Retour à l'accueil</a>
  </div>
</body>
</html>
